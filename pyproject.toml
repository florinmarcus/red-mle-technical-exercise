[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "red-store"
version = "0.1.0"
description = "SQLite store for the RED incident ingestion technical exercise"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
red = "red_store.cli:main"

[tool.setuptools.package-data]
red_store = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
